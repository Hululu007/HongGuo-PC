version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 4
    groups:
      react-runtime:
        applies-to: version-updates
        patterns: [react, react-dom]
      vite-toolchain:
        applies-to: version-updates
        patterns: [vite, "@vitejs/plugin-react"]
      routine-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    commit-message:
      prefix: build(deps)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    commit-message:
      prefix: build(ci)
