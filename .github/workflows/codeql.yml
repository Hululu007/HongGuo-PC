name: CodeQL
on:
  push:
    branches: [main]
    paths: ['src/**', 'main.js', 'preload.js', 'package*.json', '.github/workflows/codeql.yml']
  pull_request:
    branches: [main]
    paths: ['src/**', 'main.js', 'preload.js', 'package*.json', '.github/workflows/codeql.yml']
  schedule:
    - cron: '31 2 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  javascript:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4