# 源码回归检查，包含公开红果素材的真实解码。
name: Test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install real-media test tools
        run: |
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - run: npm test
      - run: npm run build:react
      - name: Audit production dependencies and retain the complete build dependency report
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --json > npm-audit.json || jq -e '.metadata.vulnerabilities' npm-audit.json > /dev/null
          npm sbom --package-lock-only --sbom-format=cyclonedx > sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: dependency-evidence
          path: |
            npm-audit.json
            sbom.cdx.json
          if-no-files-found: error
