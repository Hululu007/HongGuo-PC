# 源码回归检查，包含公开红果素材的真实解码。
name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install real-media test tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm test
      - run: npm run build:react
      - name: Audit production dependencies and retain the complete build dependency report
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --json > npm-audit.json || jq -e '.metadata.vulnerabilities' npm-audit.json > /dev/null
          npm sbom --package-lock-only --sbom-format=cyclonedx > sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-evidence
          path: |
            npm-audit.json
            sbom.cdx.json
          if-no-files-found: error
